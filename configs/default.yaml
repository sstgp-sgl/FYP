# Single config for all pipeline stages.
device: cuda
seed: 42
image_size: 512

paths:
  input_image: data/input/dog.png
  foreground_dir: outputs/foreground
  views_dir: outputs/views
  vggt_dir: outputs/vggt
  gaussian_dir: outputs/gaussian
  mesh_dir: outputs/mesh
  subjects_dir: outputs/subjects
  vggt_repo: /root/autodl-tmp/vggt

segment:
  # sam2_config is a Hydra config name resolved inside the sam2 package,
  # not a filesystem path, so these live outside paths: (which absolutizes).
  sam2_checkpoint: /root/autodl-tmp/sam2/checkpoints/sam2.1_hiera_large.pt
  sam2_config: configs/sam2.1/sam2.1_hiera_l.yaml
  # Fractional [x0, y0, x1, y1] box prompt; SAM2 segments the dominant
  # object inside it. A center point alone tends to pick a sub-part.
  box: [0.04, 0.02, 0.96, 0.99]
  feather_px: 3          # gaussian blur radius on mask edge
  background_gray: 255   # background fill for the composited foreground

views:
  model: sudo-ai/zero123plus-v1.2
  num_inference_steps: 75
  guidance_scale: 4.0
  include_original: true   # 原图作为第7张基准视角(azimuth 0/elevation 0)喂给VGGT；false=只用6张
  # Zero123++ v1.2 fixed cameras, relative to the input view:
  azimuths: [30, 90, 150, 210, 270, 330]
  elevations: [20, -10, 20, -10, 20, -10]

vggt:
  model: facebook/VGGT-1B
  use_point_map: true      # true = VGGT pointmap branch (globally consistent);
                           # false = unproject per-frame depth (noisier)
  conf_percentile: 40      # drop points below this confidence percentile
  outlier_nb_neighbors: 20
  outlier_std_ratio: 2.0

gaussian:
  iterations: 4000
  ssim_weight: 0.2
  orbit_frames: 60

mesh:
  poisson_depth: 8       # Open3D Poisson octree depth (8 is faster; 9 finer)
  density_quantile: 0.02 # drop lowest-density vertices (trim hull)
  normal_knn: 30

subjects:
  # Interactive multi-subject selector (scripts/07_subjects_web.py):
  # text proposals via Florence-2 open-vocabulary detection,
  # refined with SAM2 points/boxes in the browser.
  florence_model: microsoft/Florence-2-base
  server:
    host: 127.0.0.1
    port: 7861
