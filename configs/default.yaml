# Web → SAM2 → Zero123++ → VGGT. Relative paths use the project root.
# include_original: true = 7 views; false = 6 generated views.
device: cuda
seed: 42
image_size: 512
paths:
  views_dir: outputs/views
  subjects_dir: outputs/subjects
  vggt_repo: /root/autodl-tmp/vggt
segment:
  sam2_checkpoint: /root/autodl-tmp/sam2/checkpoints/sam2.1_hiera_large.pt
  sam2_config: configs/sam2.1/sam2.1_hiera_l.yaml
  background_gray: 255
views:
  model: sudo-ai/zero123plus-v1.2
  num_inference_steps: 75
  guidance_scale: 4.0
  include_original: true
  azimuths:
  - 30
  - 90
  - 150
  - 210
  - 270
  - 330
  elevations:
  - 20
  - -10
  - 20
  - -10
  - 20
  - -10
vggt:
  model: facebook/VGGT-1B
  use_point_map: true
  conf_percentile: 65
  outlier_nb_neighbors: 20
  outlier_std_ratio: 2.0
output_dir: outputs/reconstruct
server:
  host: 127.0.0.1
  port: 7861
