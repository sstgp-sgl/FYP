# XJTLU HPC paths. Relative entries resolve against the repo root, so this file
# works unchanged for the layout:
#   ~/work/code/FYP     this repository
#   ~/work/deps/sam2    SAM2 checkout + checkpoints/
#   ~/work/deps/vggt    VGGT checkout
# scripts/vggt_headless.py overrides views_dir/subjects_dir/output_dir from --out.
device: cuda
seed: 42
image_size: 512
paths:
  views_dir: ../../runs/_views
  subjects_dir: ../../runs/_subjects
  vggt_repo: ../../deps/vggt
segment:
  sam2_checkpoint: ../../deps/sam2/checkpoints/sam2.1_hiera_large.pt
  sam2_config: configs/sam2.1/sam2.1_hiera_l.yaml
views:
  model: sudo-ai/zero123plus-v1.2
  num_inference_steps: 75
  guidance_scale: 4.0
  include_original: true
  azimuths: [30, 90, 150, 210, 270, 330]
  elevations: [20, -10, 20, -10, 20, -10]
vggt:
  model: facebook/VGGT-1B
  use_point_map: true
  conf_percentile: 65
  outlier_nb_neighbors: 20
  outlier_std_ratio: 2.0
output_dir: ../../runs/_reconstruct
server:
  host: 127.0.0.1
  port: 7861
