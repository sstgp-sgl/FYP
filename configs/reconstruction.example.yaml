# Copy to reconstruction.local.yaml and fill your own model paths.
common:
  points: 120000
  seed: 42
  gray: true
  normalize: true
methods:
  vggt:
    pipeline_config: configs/default.yaml
    # Optional: reuse an existing generated views.json directory.
    # views_dir: /path/to/views/subject
  triposr:
    gray: false
    repo: /path/to/TripoSR
    weights: /path/to/TripoSR-weights
    resolution: 256
    threshold: 25.0
    # Optional, only for the local-config TripoSR patch used on HPC:
    # dino_config: /path/to/dino-config.json
  hunyuan:
    repo: /path/to/Hunyuan3D-2
    weights: /path/to/Hunyuan3D-2mini/hunyuan3d-dit-v2-mini
    resolution: 256
    steps: 30
