# Tour module configuration (CPU only). Copy to tour.yaml if you need local
# overrides; never commit real API keys. Relative output_root resolves against
# the project root, independent of the process cwd.
tour:
  output_root: outputs/tours
  max_upload_bytes: 104857600      # 100 MiB
  max_points: 2000000              # parsed vertex cap
  preview_points: 60000            # fixed-size display preview
  aspect_ratio: 1.7777777777777777 # 16:9, single value for preview and playback
  language: zh-CN
  max_scenes_per_page: 100
  pixel_ratio_max: 2
  narration:
    zh_chars_per_second: 5.5       # heuristic warning only
    en_words_per_second: 2.5
llm:
  enabled: false
  provider: chat_completions_compatible
  base_url: ""                  # fill in the API root of the service you use
  model: ""                     # fill in a model id you have access to
  api_key_env: FYP_LLM_API_KEY
  response_mode: text_json      # text_json | json_object
  request_timeout_seconds: 45
  run_timeout_seconds: 100
  max_calls_per_run: 2
  max_output_tokens: 1500
  temperature: 0.2
