<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TripoSR 彩色网格渲染</title>
<style>body{font:16px/1.7 system-ui;max-width:1200px;margin:30px auto;padding:18px;background:#f3f5f8;color:#243445}canvas{width:100%;height:540px;display:block;background:#eef2f6;border-radius:12px;touch-action:none}button,input{font:inherit;padding:7px;margin:6px}a{color:#17616c}.controls{background:white;padding:12px;margin-bottom:16px}#status{min-height:28px}</style>
<h1>TripoSR 彩色网格渲染</h1><p>拖动旋转，滚轮缩放。模型预测 RGB 与真实三角面一起渲染；背面颜色仍为推测，没有 UV 纹理烘焙。灰色对照只切换显示材质，不改变几何。</p>
<div class="controls"><button id="front">正面</button><button id="side">侧面</button><button id="back">背面</button><button id="rotate">自动旋转</button><button id="export">导出当前视角 PNG</button><label><input id="gray" type="checkbox">灰色对照</label><label><input id="lighting" type="checkbox" checked>表面光照</label><label>载入 mesh.ply <input id="file" type="file" accept=".ply"></label></div>
<canvas id="canvas"></canvas><p id="status">正在读取同目录 mesh.ply…</p><p><a href="mesh.ply" download>下载彩色三角网格 PLY</a> · <a href="pointcloud.ply" download>下载彩色点云 PLY</a> · <a href="run.json">参数与来源</a></p>
<script>
'use strict';
const canvas=document.getElementById('canvas'),status=document.getElementById('status'),gl=canvas.getContext('webgl2',{antialias:true,preserveDrawingBuffer:true});
let yaw=0,pitch=.06,distance=4.2,count=0,automatic=false,meshInfo=null;
function compile(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}
function parsePLY(buffer){
 const prefix=new TextDecoder().decode(new Uint8Array(buffer,0,Math.min(buffer.byteLength,65536)));const end=prefix.indexOf('end_header\n');if(end<0)throw Error('缺少 PLY 头');
 const header=prefix.slice(0,end),offset=end+11;if(!header.includes('format binary_little_endian 1.0'))throw Error('需要本项目导出的 binary little endian PLY');
 const vertices=Number(header.match(/element vertex (\d+)/)?.[1]),faces=Number(header.match(/element face (\d+)/)?.[1]);
 const properties=header.split('element vertex ')[1]?.split('element face ')[0].split('\n').filter(s=>s.startsWith('property '));
 if(!vertices||!faces||properties.join('|')!=='property float x|property float y|property float z|property uchar red|property uchar green|property uchar blue')throw Error('请选择当前导出的 mesh.ply（XYZ/RGB＋三角面）');
 const data=new DataView(buffer),positions=new Float32Array(vertices*3),colors=new Uint8Array(vertices*3),indices=new Uint32Array(faces*3);let cursor=offset;
 for(let i=0;i<vertices;i++){for(let j=0;j<3;j++)positions[i*3+j]=data.getFloat32(cursor+j*4,true);for(let j=0;j<3;j++)colors[i*3+j]=data.getUint8(cursor+12+j);cursor+=15;}
 for(let i=0;i<faces;i++){if(data.getUint8(cursor++)!==3)throw Error('只支持三角面');for(let j=0;j<3;j++){const index=data.getInt32(cursor,true);if(index<0||index>=vertices)throw Error('三角面索引无效');indices[i*3+j]=index;cursor+=4;}}
 return {positions,colors,indices,vertices,faces};
}
let program,uniforms;
function setup(){
 if(!gl)throw Error('浏览器不支持 WebGL2，请使用桌面 Chrome 或 Edge');
 const vertex=`#version 300 es
 in vec3 position;in vec3 color;uniform float yaw;uniform float pitch;uniform float distance;uniform float aspect;out vec3 rgb;out vec3 viewPosition;
 void main(){vec3 p=vec3(position.x,position.z,-position.y);float a=cos(yaw),b=sin(yaw),c=cos(pitch),d=sin(pitch);p=vec3(a*p.x+b*p.z,p.y,-b*p.x+a*p.z);p=vec3(p.x,c*p.y-d*p.z,d*p.y+c*p.z);p.z-=distance;viewPosition=p;rgb=color;float f=2.41421356;gl_Position=vec4(p.x*f/aspect,p.y*f,-1.01005025*p.z-.20100503,-p.z);}`;
 const fragment=`#version 300 es
 precision highp float;in vec3 rgb;in vec3 viewPosition;uniform bool gray;uniform bool lighting;out vec4 pixel;
 void main(){vec3 c=gray?vec3(.705882):rgb;if(lighting){vec3 n=normalize(cross(dFdx(viewPosition),dFdy(viewPosition)));c*=.35+.65*abs(dot(n,normalize(vec3(.5,.8,1.0))));}pixel=vec4(c,1.0);}`;
 program=gl.createProgram();gl.attachShader(program,compile(gl.VERTEX_SHADER,vertex));gl.attachShader(program,compile(gl.FRAGMENT_SHADER,fragment));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);
 uniforms=Object.fromEntries(['yaw','pitch','distance','aspect','gray','lighting'].map(k=>[k,gl.getUniformLocation(program,k)]));gl.enable(gl.DEPTH_TEST);gl.clearColor(.935,.946,.964,1);
}
function draw(){
 if(!gl||!count)return;const scale=Math.min(devicePixelRatio||1,2),w=Math.round(canvas.clientWidth*scale),h=Math.round(canvas.clientHeight*scale);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}gl.viewport(0,0,w,h);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
 gl.uniform1f(uniforms.yaw,yaw);gl.uniform1f(uniforms.pitch,pitch);gl.uniform1f(uniforms.distance,distance);gl.uniform1f(uniforms.aspect,w/h);gl.uniform1i(uniforms.gray,document.getElementById('gray').checked);gl.uniform1i(uniforms.lighting,document.getElementById('lighting').checked);gl.drawElements(gl.TRIANGLES,count,gl.UNSIGNED_INT,0);
}
function load(buffer){
 const mesh=parsePLY(buffer);for(const [name,values,size,type,normalized]of [['position',mesh.positions,3,gl.FLOAT,false],['color',mesh.colors,3,gl.UNSIGNED_BYTE,true]]){const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,values,gl.STATIC_DRAW);const location=gl.getAttribLocation(program,name);gl.enableVertexAttribArray(location);gl.vertexAttribPointer(location,size,type,normalized,0,0);}
 const b=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,b);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,mesh.indices,gl.STATIC_DRAW);count=mesh.indices.length;meshInfo={vertices:mesh.vertices,faces:mesh.faces};status.textContent=mesh.vertices.toLocaleString()+' 个顶点 · '+mesh.faces.toLocaleString()+' 个三角面 · 原始 Z-up 在显示时转为 Y-up';window.viewer.ready=true;draw();
}
window.viewer={ready:false,setView:(y,p=.06,d=4.2)=>{yaw=y;pitch=p;distance=d;draw();},setGray:value=>{document.getElementById('gray').checked=value;draw();},info:()=>meshInfo};
document.getElementById('front').onclick=()=>window.viewer.setView(0);document.getElementById('side').onclick=()=>window.viewer.setView(Math.PI/2);document.getElementById('back').onclick=()=>window.viewer.setView(Math.PI);
function animate(){if(!automatic)return;yaw+=.012;draw();requestAnimationFrame(animate);}document.getElementById('rotate').onclick=()=>{automatic=!automatic;document.getElementById('rotate').textContent=automatic?'停止旋转':'自动旋转';if(automatic)animate();};
for(const id of ['gray','lighting'])document.getElementById(id).onchange=draw;
document.getElementById('export').onclick=()=>{if(!count)return;draw();canvas.toBlob(blob=>{const a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='triposr-render.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});};
let dragging=false,last=[0,0];canvas.onpointerdown=e=>{dragging=true;last=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId);};canvas.onpointerup=()=>dragging=false;canvas.onpointercancel=()=>dragging=false;canvas.onpointermove=e=>{if(!dragging)return;yaw+=(e.clientX-last[0])*.01;pitch=Math.max(-1.4,Math.min(1.4,pitch+(e.clientY-last[1])*.01));last=[e.clientX,e.clientY];draw();};canvas.onwheel=e=>{e.preventDefault();distance=Math.max(2.2,Math.min(10,distance*Math.exp(e.deltaY*.001)));draw();};window.onresize=draw;
document.getElementById('file').onchange=async e=>{try{load(await e.target.files[0].arrayBuffer());}catch(error){status.textContent=error.message;}};
try{setup();fetch('mesh.ply').then(r=>{if(!r.ok)throw Error('未找到 mesh.ply');return r.arrayBuffer();}).then(load).catch(e=>{status.textContent=e.message+'；也可使用上方文件选择器载入。';});}catch(error){status.textContent=error.message;}
</script></html>
