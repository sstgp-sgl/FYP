<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FYP 三幕故事板</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#243445;font:15px/1.7 system-ui}main{max-width:1320px;margin:auto;padding:25px}h1{font-size:28px}h2{font-size:20px}h3{font-size:16px}section{margin:24px 0}button,input,select,textarea{font:inherit;padding:8px;border:1px solid #bac8d3;border-radius:4px}button{cursor:pointer;background:#fff;color:#165862}button.primary{background:#165862;color:white}button:disabled{opacity:.5;cursor:wait}textarea{width:100%;min-height:110px}label{display:block;margin:9px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.panel{background:white;padding:20px}.frames{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.frames article{background:white;padding:12px}.frames img{width:100%}.muted{color:#596b7c;font-size:13px}.banner{padding:12px;background:#e2ecee}canvas{max-width:100%;height:auto;background:#eef2f4}#mask{max-width:100%;max-height:300px;background:#ddd}#artifacts a{display:inline-block;margin:5px}#history button{margin:4px}a{color:#165862}.error{color:#9e2f2f}pre{white-space:pre-wrap;overflow-wrap:anywhere}.hidden{display:none}@media(max-width:850px){.grid,.frames{grid-template-columns:1fr}}</style>
<main><p class="muted">FYP / P6 / 真实资产与三幕分镜</p><h1>选择资产，让故事变成三幕画面</h1><p class="banner">当前为静态刚体分镜。真实资产的朝向仍待人工确认，预览沿用候选方向；名称确认不会自动确认朝向。</p>
<div class="grid"><section class="panel"><h2>1 · 选择已有资产</h2><div id="assets"></div><p class="muted">选择2–3个名称不同的资产。每次任务都会冻结所选资产及配置。</p></section>
<section class="panel"><h2>或从照片创建一个资产</h2><input type="file" id="file" accept="image/*"><button id="upload">上传图片</button><p id="uploadStatus" role="status"></p><canvas id="selection" width="1" height="1" class="hidden"></canvas><label><input type="checkbox" id="negative"> 排除点（不勾选时点击主体）</label><button id="clearPoints">清空选点</button><button id="segment">分割预览</button><p id="pointCount" class="muted"></p><img id="mask" alt="实际分割前景" class="hidden"><label>资产名称 <input id="name" maxlength="50" placeholder="例如：新熊"></label><label><input type="checkbox" id="nameConfirmed"> 我确认这个名称与选中的主体对应</label><label>重建方法 <select id="method"></select></label><button id="reconstruct">确认掩码并重建</button></section></div>
<section class="panel"><h2>2 · 输入故事</h2><textarea id="story" placeholder="例如：第一幕人物在熊的左侧远处；第二幕人物靠近熊；第三幕人物保持不动，镜头关注人物。"></textarea><button id="start" class="primary">生成三幕故事板</button><p class="muted">提交期间按钮会锁定。同一个请求重发会返回原任务，刷新页面可恢复查看。</p></section>
<section><h2>3 · 当前任务</h2><p id="status" class="banner" role="status">尚未开始任务</p><p id="error" class="error"></p><p id="question"></p><img id="assetPreview" alt="新资产实际点云预览" class="hidden" style="max-width:600px;width:100%"><div id="frames" class="frames"></div><a id="download" class="hidden">下载已登记产物 ZIP</a><details><summary>逐幕验收、单文件下载与运行依据</summary><div id="artifacts"></div><pre id="validation"></pre></details></section>
<section><h2>历史运行</h2><div id="history"></div></section></main>
<script>
const $=id=>document.getElementById(id),state={upload:null,points:[],segment:localStorage.getItem('p6segment'),job:localStorage.getItem('p6job'),image:null,busy:new Set(),selected:new Set(JSON.parse(localStorage.getItem('p6assets')||'[]')),pending:JSON.parse(localStorage.getItem('p6pending')||'{}')};
async function api(url,options){const response=await fetch(url,options);if(!response.ok){let body=await response.json().catch(()=>({detail:response.statusText}));throw Error(typeof body.detail==='string'?body.detail:JSON.stringify(body.detail));}return response.json();}
function message(e){$('error').textContent=e.message||String(e);}
const buttons={story:'start',segment:'segment',asset:'reconstruct'};
function savePending(){localStorage.setItem('p6pending',JSON.stringify(state.pending));}
async function submit(endpoint,payload,button,kind){if(state.busy.has(kind)||state.pending[kind])return;state.busy.add(kind);button.disabled=true;$('error').textContent='';let success=false;try{const last=JSON.parse(localStorage.getItem('p6lastRequest')||'null');const request=last&&last.endpoint===endpoint&&!last.completed&&JSON.stringify(last.payload)===JSON.stringify(payload)?last.request:{request_id:crypto.randomUUID(),...payload};localStorage.setItem('p6lastRequest',JSON.stringify({endpoint,request,payload,completed:false}));const job=await api(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(request)});state.pending[kind]=job.id;savePending();success=true;localStorage.setItem('p6lastRequest',JSON.stringify({endpoint,request,payload,completed:true}));view(job.id);if(kind==='segment')state.segment=job.id;await history();}catch(e){message(e);}finally{state.busy.delete(kind);if(!success)button.disabled=false;}}
async function assets(){const rows=await api('/api/p6/assets');$('assets').replaceChildren();for(const asset of rows){const label=document.createElement('label'),check=document.createElement('input');check.type='checkbox';check.value=asset.key;check.checked=state.selected.has(asset.key);check.onchange=()=>{check.checked?state.selected.add(asset.key):state.selected.delete(asset.key);localStorage.setItem('p6assets',JSON.stringify([...state.selected]));};label.append(check,document.createTextNode(' '+asset.name+' · '+asset.asset_id.slice(0,8)+' · 朝向'+(asset.orientation==='confirmed'?'已确认':'待确认')));$('assets').append(label);}}
async function history(){const rows=await api('/api/p6/jobs');for(const [kind,id]of Object.entries(state.pending)){const job=rows.find(j=>j.id===id);if(job&&['succeeded','failed','needs_clarification','interrupted'].includes(job.status)){delete state.pending[kind];$(buttons[kind]).disabled=false;savePending();}}$('history').replaceChildren();for(const job of rows){const b=document.createElement('button');b.textContent=job.kind+' · '+job.status+' · '+job.id.slice(0,8);b.onclick=()=>view(job.id);$('history').append(b);}}
function view(id){state.job=id;localStorage.setItem('p6job',id);poll();}
const stageNames={freezing:'冻结输入',queued:'排队',starting:'启动',segmentation:'SAM2分割',reconstruction:'三维重建',asset_registration:'资产登记',asset_preview:'渲染资产预览',understanding:'模型理解',repair:'根据失败修正计划',compile:'空间与事件编译',render:'生成图片',validation:'独立验收',input:'检查输入',snapshot:'冻结资产',completed:'分镜生成完成',complete:'结束',failed:'失败',interrupted:'已中断'};
let polling=false;
async function poll(){if(!state.job||polling)return;polling=true;try{const id=state.job,job=await api('/api/p6/jobs/'+id);if(id!==state.job)return;$('status').textContent=job.kind+' · '+job.status+' · '+(stageNames[job.stage]||job.stage)+' · '+job.id.slice(0,8);$('error').textContent=job.error?(typeof job.error==='string'?job.error:JSON.stringify(job.error)):'';$('question').textContent=job.question||'';$('frames').replaceChildren();for(const frame of job.frames||[]){const card=document.createElement('article'),title=document.createElement('h3'),caption=document.createElement('p'),result=document.createElement('p');title.textContent=frame.scene_id;caption.textContent=frame.narration;result.textContent=frame.validation.passed===true?'独立验收通过':frame.validation.passed===false?'验收未通过':'等待验收';card.append(title);if(frame.image){const img=document.createElement('img');img.src='/api/p6/jobs/'+id+'/artifacts/'+frame.image;img.alt=frame.scene_id+'实际点云渲染';card.append(img);}card.append(caption,result);$('frames').append(card);}const preview=(job.artifacts||[]).find(a=>a.name==='asset_preview.png');if(preview){$('assetPreview').src='/api/p6/jobs/'+id+'/artifacts/'+preview.id;$('assetPreview').classList.remove('hidden');}else $('assetPreview').classList.add('hidden');$('artifacts').replaceChildren();for(const artifact of job.artifacts||[]){const a=document.createElement('a');a.href='/api/p6/jobs/'+id+'/artifacts/'+artifact.id+'?download=true';a.textContent=artifact.name;$('artifacts').append(a);}if((job.artifacts||[]).length){$('download').classList.remove('hidden');$('download').href='/api/p6/jobs/'+id+'/download';}else $('download').classList.add('hidden');$('validation').textContent=JSON.stringify({provider:job.provider,frames:job.frames,integrity_errors:job.integrity_errors},null,2);
if(job.kind==='segment'&&job.status==='succeeded'){state.segment=id;localStorage.setItem('p6segment',id);const fg=job.artifacts.find(a=>a.name==='foreground.png');if(fg){$('mask').src='/api/p6/jobs/'+id+'/artifacts/'+fg.id;$('mask').classList.remove('hidden');}}if(job.kind==='asset'&&job.status==='succeeded')await assets();if(['succeeded','failed','needs_clarification','interrupted'].includes(job.status))await history();}catch(e){message(e);}finally{polling=false;}}
function draw(){if(!state.image)return;const canvas=$('selection'),ctx=canvas.getContext('2d');ctx.drawImage(state.image,0,0);for(const [x,y,label]of state.points){ctx.fillStyle=label?'#e33c35':'#227fc0';ctx.beginPath();ctx.arc(x,y,Math.max(4,canvas.width*.008),0,Math.PI*2);ctx.fill();}$('pointCount').textContent='已选择 '+state.points.length+' 个点';}
$('upload').onclick=async()=>{try{const file=$('file').files[0];if(!file)throw Error('请先选择图片');const form=new FormData();form.append('file',file);const row=await api('/api/p6/uploads',{method:'POST',body:form});state.upload=row.id;state.points=[];state.segment=null;localStorage.removeItem('p6segment');$('mask').classList.add('hidden');const img=new Image();img.onload=()=>{state.image=img;$('selection').width=img.width;$('selection').height=img.height;$('selection').classList.remove('hidden');draw();};img.src='/api/p6/uploads/'+row.id+'/image';$('uploadStatus').textContent='图片已上传，请点击要重建的主体。';}catch(e){message(e);}};
$('selection').onclick=e=>{const box=e.currentTarget.getBoundingClientRect();state.points.push([(e.clientX-box.left)*e.currentTarget.width/box.width,(e.clientY-box.top)*e.currentTarget.height/box.height,$('negative').checked?0:1]);draw();};$('clearPoints').onclick=()=>{state.points=[];draw();};
$('segment').onclick=()=>{if(!state.upload)return message(Error('请先上传图片'));submit('/api/p6/segments',{upload_id:state.upload,points:state.points},$('segment'),'segment');};
$('reconstruct').onclick=()=>{if(!state.segment)return message(Error('请先完成分割并检查前景'));submit('/api/p6/reconstructions',{segment_id:state.segment,name:$('name').value,name_confirmed:$('nameConfirmed').checked,method:$('method').value},$('reconstruct'),'asset');};
$('start').onclick=()=>submit('/api/p6/stories',{asset_keys:[...state.selected],story:$('story').value},$('start'),'story');
for(const kind of Object.keys(state.pending))$(buttons[kind]).disabled=true;
Promise.all([assets(),history(),api('/api/p6/config').then(config=>{for(const method of config.methods){const option=document.createElement('option');option.value=method;option.textContent=method;$('method').append(option);}})]).catch(message);poll();setInterval(poll,1500);setInterval(()=>history().catch(message),4000);
</script></html>
