<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>多主体选择器 · Florence-2 + SAM2 + 工作流</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "PingFang SC", sans-serif; background: #1e1f22; color: #ddd; }
  #layout { display: flex; gap: 16px; padding: 16px; height: 100vh; }
  #left { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  #right { width: 360px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
  #cvwrap { flex: 1; background: #000; border-radius: 8px; display: flex; align-items: center; justify-content: center; min-height: 0; }
  canvas { max-width: 100%; max-height: 100%; border-radius: 8px; cursor: crosshair; }
  #toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button, select, input { padding: 6px 10px; border-radius: 6px; border: 1px solid #444; background: #2b2d31; color: #eee; }
  button:hover { background: #3a3d42; }
  .card { background: #26282c; border: 1px solid #3a3d42; border-radius: 8px; padding: 10px; }
  .subject { margin-bottom: 8px; padding: 8px; border-radius: 6px; border: 1px solid #444; background: #2b2d31; }
  .subject.active { border-color: #f0c040; }
  .row { display: flex; gap: 6px; align-items: center; margin-top: 6px; }
  .row input[type=text] { flex: 1; }
  #status { font-size: 12px; color: #9aa0a6; white-space: pre-wrap; }
  h3 { margin: 4px 0; font-size: 14px; color: #bbb; }
  label { font-size: 13px; }
  .wfrow { padding: 8px; border-radius: 6px; border: 1px solid #3a3d42; background: #2b2d31; margin-bottom: 8px; font-size: 13px; }
  .thumbs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .thumb { width: 44px; height: 44px; object-fit: cover; border-radius: 4px; border: 1px solid #444; }
  .pcbtn { margin-top: 6px; background: #3d5a80; border-color: #5a7ba0; }
  #viewerModal { position: fixed; inset: 0; background: rgba(0,0,0,.9); z-index: 50; flex-direction: column; padding: 10px; }
  #viewerCanvas { flex: 1; min-height: 0; }
  .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
</style>
</head>
<body>
<div id="layout">
  <div id="left">
    <div id="cvwrap"><canvas id="cv"></canvas></div>
    <div id="toolbar">
      <label>模式:
        <select id="mode">
          <option value="fg" selected>正点(左键)</option>
          <option value="bg">负点(右键)</option>
          <option value="box">框选(拖拽)</option>
        </select>
      </label>
      <button id="segBtn">重新生成掩码</button>
      <button id="clearBtn">清空当前主体提示</button>
    </div>
  </div>
  <div id="right">
    <div class="card">
      <h3>1 · 上传油画</h3>
      <input type="file" id="file" accept="image/*">
    </div>
    <div class="card">
      <h3>2 · 文字检测物体</h3>
      <div class="row">
        <input type="text" id="texts" placeholder='逗号分隔，如: a horse, a woman'>
        <button id="detectBtn">检测</button>
      </div>
    </div>
    <div class="card">
      <h3>3 · 主体列表（点击选中，画布上微调）</h3>
      <div id="subjects"></div>
    </div>
    <button id="saveBtn">保存全部 → subjects.json</button>
    <div class="card">
      <h3>4 · 工作流：视角生成 + 点云重建</h3>
      <div class="row">
        <button id="wfBtn" style="flex:1">▶ 运行工作流 (生成视角 + 重建，强制重跑)</button>
      </div>
      <div id="wfSubjects" style="margin-top:8px;"></div>
    </div>
    <div id="status">提示：先上传图片；检测结果会成为主体，点击主体行选中后在画布上微调。</div>
  </div>
</div>

<div id="viewerModal" style="display:none;">
  <div class="bar">
    <span id="viewerTitle" style="color:#ddd;font-size:14px;"></span>
    <button id="viewerClose">关闭</button>
  </div>
  <div id="viewerCanvas"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const canvas = $("cv"), ctx = canvas.getContext("2d");
let imgEl = new Image();
let imageInfo = null;
let scale = 1;
let subjects = [];
let activeIdx = -1;
let dragging = false, dragStart = null, dragEnd = null;

// ---------------- upload ----------------
$("file").addEventListener("change", async (e) => {
  const fd = new FormData();
  fd.append("file", e.target.files[0]);
  $("status").textContent = "上传中...";
  const r = await fetch("/api/upload", { method: "POST", body: fd });
  const j = await r.json();
  if (j.error) { $("status").textContent = j.error; return; }
  imageInfo = { w: j.size[0], h: j.size[1] };
  subjects = []; activeIdx = -1;
  imgEl.src = "/api/image?" + Date.now();
  fitCanvas();
  renderSubjects();
  $("status").textContent = "已上传 " + j.name + " (" + j.size[0] + "×" + j.size[1] + ")";
});

function fitCanvas() {
  const wrap = $("cvwrap");
  scale = Math.min((wrap.clientWidth - 16) / imageInfo.w, (wrap.clientHeight - 16) / imageInfo.h);
  canvas.width = imageInfo.w * scale;
  canvas.height = imageInfo.h * scale;
  draw();
}
imgEl.onload = () => draw();

// ---------------- canvas ----------------
function toImageXY(e) {
  const rect = canvas.getBoundingClientRect();
  return [(e.clientX - rect.left) / scale, (e.clientY - rect.top) / scale];
}

canvas.addEventListener("mousedown", (e) => {
  if (!imageInfo || activeIdx < 0) return;
  e.preventDefault();
  const [x, y] = toImageXY(e);
  const s = subjects[activeIdx];
  if (e.button === 2) {
    s.points.push([x, y]); s.labels.push(0);
    segmentActive();
  } else if ($("mode").value === "box") {
    dragging = true; dragStart = [x, y]; dragEnd = [x, y];
  } else {
    const lbl = $("mode").value === "bg" ? 0 : 1;
    s.points.push([x, y]); s.labels.push(lbl);
    segmentActive();
  }
});
canvas.addEventListener("mousemove", (e) => {
  if (dragging) { dragEnd = toImageXY(e); draw(); }
});
canvas.addEventListener("mouseup", (e) => {
  if (!dragging) return;
  dragging = false;
  const s = subjects[activeIdx];
  const [x0, y0] = dragStart, [x1, y1] = dragEnd;
  s.boxes.push([Math.min(x0, x1), Math.min(y0, y1), Math.max(x0, x1), Math.max(y0, y1)]);
  dragStart = dragEnd = null;
  segmentActive();
});
canvas.addEventListener("contextmenu", (e) => e.preventDefault());

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (!imageInfo) return;
  ctx.drawImage(imgEl, 0, 0, canvas.width, canvas.height);
  subjects.forEach((s, i) => {
    ctx.lineWidth = 2;
    ctx.strokeStyle = i === activeIdx ? "#ffd54f" : "#ff5252";
    s.boxes.forEach((b) => ctx.strokeRect(b[0]*scale, b[1]*scale, (b[2]-b[0])*scale, (b[3]-b[1])*scale));
    s.points.forEach((p, k) => {
      ctx.fillStyle = (s.labels[k] || 1) === 0 ? "#2979ff" : "#69f0ae";
      ctx.beginPath(); ctx.arc(p[0]*scale, p[1]*scale, 4, 0, Math.PI*2); ctx.fill();
    });
    const idx = s.maskIdx >= 0 ? s.maskIdx : 0;
    if (s.maskImgs && s.maskImgs[idx]) {
      ctx.globalAlpha = 0.35;
      ctx.drawImage(s.maskImgs[idx], 0, 0, canvas.width, canvas.height);
      ctx.globalAlpha = 1;
    }
  });
  if (dragging && dragStart && dragEnd) {
    ctx.strokeStyle = "#ffd54f"; ctx.lineWidth = 1.5;
    ctx.strokeRect(dragStart[0]*scale, dragStart[1]*scale,
      (dragEnd[0]-dragStart[0])*scale, (dragEnd[1]-dragStart[1])*scale);
  }
}

// ---------------- SAM2 segment ----------------
async function segmentActive() {
  const s = subjects[activeIdx];
  if (!s) return;
  $("status").textContent = "SAM2 分割中...";
  const r = await fetch("/api/segment", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ boxes: s.boxes, points: s.points, labels: s.labels }),
  });
  const j = await r.json();
  if (j.error) { $("status").textContent = "分割失败: " + j.error; return; }
  s.scores = j.scores;
  s.maskImgs = j.masks.map((b64) => { const im = new Image(); im.src = "data:image/png;base64," + b64; return im; });
  if (s.maskIdx < 0) s.maskIdx = s.scores.indexOf(Math.max(...s.scores));
  $("status").textContent = "掩码分数: " + s.scores.map(v => v.toFixed(3)).join(", ") + " → 用候选 " + s.maskIdx;
  renderSubjects(); draw();
}

// ---------------- detect ----------------
$("detectBtn").addEventListener("click", async () => {
  if (!imageInfo) { $("status").textContent = "请先上传图片"; return; }
  const texts = $("texts").value.split(/[,，]/).map(t => t.trim()).filter(Boolean);
  if (!texts.length) { $("status").textContent = "输入检测文字"; return; }
  $("status").textContent = "Florence-2 检测中...（首次运行需下载模型）";
  const r = await fetch("/api/detect", { method: "POST", headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ texts }) });
  const j = await r.json();
  if (j.error) { $("status").textContent = "检测失败: " + j.error; return; }
  if (!j.boxes.length) { $("status").textContent = "未检测到物体，换个说法试试"; return; }
  j.boxes.forEach((b) => {
    const name = b.label.replace(/[^\w\u4e00-\u9fff]+/g, "_") || "subject";
    subjects.push({ name, boxes: [b.box], points: [], labels: [], maskIdx: -1, maskImgs: null, scores: [] });
  });
  activeIdx = subjects.length - 1;
  $("status").textContent = "检测到 " + j.boxes.length + " 个物体，已加入列表；点击主体行后在画布上微调";
  renderSubjects(); draw();
});

// ---------------- subject list ----------------
function renderSubjects() {
  const box = $("subjects");
  box.innerHTML = "";
  subjects.forEach((s, i) => {
    const div = document.createElement("div");
    div.className = "subject" + (i === activeIdx ? " active" : "");
    div.innerHTML = `
      <div class="row">
        <input type="text" value="${s.name}" title="名称">
        <select title="掩码候选">${[0,1,2].map(k =>
          `<option value="${k}" ${k === s.maskIdx ? "selected" : ""}>候选${k}</option>`).join("")}</select>
        <button class="del">删除</button>
      </div>`;
    div.querySelector("input").addEventListener("input", (e) => { s.name = e.target.value; });
    div.querySelector("select").addEventListener("change", (e) => { s.maskIdx = +e.target.value; draw(); });
    div.querySelector(".del").addEventListener("click", () => {
      subjects.splice(i, 1);
      activeIdx = subjects.length ? Math.min(activeIdx, subjects.length - 1) : -1;
      renderSubjects(); draw();
    });
    div.addEventListener("click", () => { activeIdx = i; renderSubjects(); draw(); });
    box.appendChild(div);
  });
  if (!subjects.length) box.innerHTML = "<div style='font-size:12px;color:#888'>还没有主体。用文字检测或手动加一个。</div>";
}

$("segBtn").addEventListener("click", segmentActive);
$("clearBtn").addEventListener("click", () => {
  const s = subjects[activeIdx];
  if (s) { s.boxes = []; s.points = []; s.labels = []; draw(); $("status").textContent = "已清空当前主体提示"; }
});

// ---------------- save ----------------
$("saveBtn").addEventListener("click", async () => {
  if (!subjects.length) { $("status").textContent = "没有主体可保存"; return; }
  $("status").textContent = "保存中...（逐个重跑 SAM2）";
  const payload = subjects.map((s) => ({
    name: s.name, boxes: s.boxes, points: s.points, labels: s.labels, mask_index: s.maskIdx,
  }));
  const r = await fetch("/api/export", { method: "POST", headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ subjects: payload }) });
  const j = await r.json();
  if (j.error) { $("status").textContent = "保存失败: " + j.error; return; }
  $("status").textContent = "已保存:\n" + j.subjects.map(s =>
    `• ${s.name} (coverage ${(s.coverage*100).toFixed(1)}%) → ${s.subject_file}`).join("\n");
});

// ---------------- workflow (02b + 02c) ----------------
let wfTimer = null;
$("wfBtn").addEventListener("click", async () => {
  // force=true: views are always regenerated; without this, reconstruction
  // would skip on cached .tasks even after the 7th view appeared.
  const r = await fetch("/api/workflow/start?force=true", { method: "POST" });
  const j = await r.json();
  if (j.error) { $("status").textContent = j.error; return; }
  $("status").textContent = "工作流已启动（生成视角 → 点云重建）...";
  if (wfTimer) clearInterval(wfTimer);
  wfTimer = setInterval(pollWorkflow, 1500);
  pollWorkflow();
});

async function pollWorkflow() {
  const j = await (await fetch("/api/workflow/status")).json();
  const box = $("wfSubjects");
  let html = "";
  (j.subjects || []).forEach((s) => {
    const stageLabel = s.stage === "views" ? "生成视角" : s.stage === "reconstruct" ? "点云重建" : "等待中";
    const statusLabel = {running:"⏳ 进行中…", done:"✅ 完成", error:"❌ 失败", pending:"等待"}[s.status] || s.status;
    const views = (s.views || []).map(v =>
      `<img class="thumb" src="/outputs/${v}?ts=${Date.now()}" title="${v}" loading="lazy">`).join("");
    const btns = (s.status === "done" && s.stage === "reconstruct")
      ? `<button class="pcbtn" data-act="view" data-subj="${s.name}">🔍 查看</button>
         <button class="pcbtn" data-act="dl" data-subj="${s.name}">⬇ 下载 PLY</button>
         <button class="pcbtn" data-act="viser" data-subj="${s.name}">🖥 Viser</button>`
      : "";
    html += `<div class="wfrow"><b>${s.name}</b> · ${stageLabel} · ${statusLabel}${s.error ? " · " + s.error : ""}
      <div class="thumbs">${views}</div>${btns}</div>`;
  });
  box.innerHTML = html || "<div style='font-size:12px;color:#888'>尚未运行工作流。</div>";
  box.querySelectorAll(".pcbtn").forEach((b) => {
    b.addEventListener("click", async () => {
      const name = b.dataset.subj;
      const act = b.dataset.act;
      if (act === "view") {
        showPointcloud(name);
      } else if (act === "dl") {
        window.location.href = "/api/download/pointcloud/" + name;
      } else if (act === "viser") {
        const r = await fetch("/api/viser/open/" + name, { method: "POST" });
        const j = await r.json();
        $("status").textContent = j.error
          ? "Viser 启动失败: " + j.error
          : "Viser 已启动 → " + j.url + "（浏览器打开 http://localhost:8080）";
      }
    });
  });
  if (j.status === "done") {
    $("status").textContent = "✅ 工作流完成";
    clearInterval(wfTimer); wfTimer = null;
  } else if (j.status === "error") {
    $("status").textContent = "❌ 工作流失败: " + j.error;
    clearInterval(wfTimer); wfTimer = null;
  } else if (j.status === "running") {
    $("status").textContent = "⏳ 工作流运行中…";
  }
}

// ---------------- point cloud viewer (three.js) ----------------
let vScene, vCam, vRend, vCtl, vPts = null;
function ensureViewer() {
  if (vScene) return;
  vScene = new THREE.Scene();
  vScene.background = new THREE.Color(0x111318);
  vCam = new THREE.PerspectiveCamera(60, 1, 0.01, 20);
  vCam.position.set(0, 0.4, 2.4);
  vRend = new THREE.WebGLRenderer({ antialias: true });
  vRend.setPixelRatio(window.devicePixelRatio);
  $("viewerCanvas").appendChild(vRend.domElement);
  vCtl = new THREE.OrbitControls(vCam, vRend.domElement);
  vCtl.enableDamping = true;
  (function anim() {
    requestAnimationFrame(anim);
    vCtl.update();
    vRend.render(vScene, vCam);
  })();
  window.addEventListener("resize", resizeViewer);
  resizeViewer();
}
function resizeViewer() {
  if (!vRend) return;
  const el = $("viewerCanvas");
  vRend.setSize(el.clientWidth, Math.max(el.clientHeight, 100));
  vCam.aspect = el.clientWidth / Math.max(el.clientHeight, 1);
  vCam.updateProjectionMatrix();
}
function b64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
async function showPointcloud(subject) {
  if (typeof THREE === "undefined") { $("status").textContent = "Three.js 加载失败（CDN 不可达）"; return; }
  ensureViewer();
  $("viewerModal").style.display = "flex";
  $("viewerTitle").textContent = "点云: " + subject + "（加载中…）";
  const j = await (await fetch("/api/pointcloud/" + subject)).json();
  if (j.error) { $("viewerTitle").textContent = "无点云: " + j.error; return; }
  const pts = new Float32Array(b64ToBytes(j.points).buffer);
  const col8 = b64ToBytes(j.colors);
  const colf = new Float32Array(col8.length);
  for (let i = 0; i < col8.length; i++) colf[i] = col8[i] / 255;
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(pts, 3));
  geo.setAttribute("color", new THREE.BufferAttribute(colf, 3));
  const mat = new THREE.PointsMaterial({ size: 0.012, vertexColors: true, sizeAttenuation: true });
  if (vPts) vScene.remove(vPts);
  vPts = new THREE.Points(geo, mat);
  vScene.add(vPts);
  $("viewerTitle").textContent = `点云: ${subject} — ${j.num_shown.toLocaleString()} / ${j.num_total.toLocaleString()} 点（拖拽旋转，滚轮缩放）`;
}
$("viewerClose").addEventListener("click", () => { $("viewerModal").style.display = "none"; });
</script>
</body>
</html>
